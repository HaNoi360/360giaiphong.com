<!DOCTYPE html>
<html lang="vi">
<head>
<title>Danh sách tặng Voucher</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="Author" content="Nguyễn Trung Hưng"/>
<meta name="AuthorPhone" content="08.686.373.22"/>
<meta name="AuthorEmail" content="Hung@Giau.co"/>
%Bootstrap5%
%MyData%
</head>
<body>
  <form id="CusInfo">
    <div class="container-fluid pt-5">
      <div class="row p-3 text-center">
          <h2><b>THÔNG TIN KHÁCH NHẬN VOUCHER</b></h2>
        <div class="col-sm-8 p-3" id="Inputs">
          <input name="HoTen" placeholder="Người nhận" required/>
          <div class="row">
            <div class="col-sm-6">
              <select name="GioiTinh" required>
                <option selected disabled value="">Chọn giới tính</option>
                <option>Nam</option>
                <option>Nữ</option>
                <option>LGBT</option>
              </select>
            </div>
            <div class="col-sm-6">
              <select name="NamSinh" required>
                <script type="text/javascript">
                document.write('<option selected disabled value="">Chọn năm sinh</option>');
                for (x=1970;x<2010;x++) {
                  document.write('<option>'+x+'</option>');
                }
                </script>
              </select>
            </div>
          </div>
          <input name="DienThoai" type="number" placeholder="Số điện thoại" required/>
          <input name="DiaChi" placeholder="Địa chỉ" required/>
          <input name="TenCoSo" placeholder="Tên cơ sở"/>
          <input name="ChucDanh" placeholder="Chức danh"/>
        </div>
        <div class="col-sm-4 p-3"><textarea name="Note" id="Note" placeholder="Ghi chú" required></textarea></div>
        <div class="col-sm-12"><input type="submit" value="Lưu"/></div>
      </div>
    </div>
  </form>
</body>
</html>
